# Render Blueprint: backend API + Postgres. The frontend is not deployed here.
databases:
  - name: theone-db
    plan: free
    databaseName: theone
    user: theone

services:
  - type: web
    name: theone-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: theone-db
          property: connectionString
      - key: TEMPLATE_ENCRYPTION_KEY
        sync: false        # set once in the Render dashboard; never change it or stored templates become unreadable
      - key: API_KEY
        sync: false        # shared secret clients send as X-API-Key
      - key: CORS_ORIGINS
        value: http://localhost:3000
